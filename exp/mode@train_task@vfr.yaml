version: 000

data:
  width: 448
  height: 320
  event_num: 12
  train_folder_path: 'data.train'
  test_folder_path: 'data.test'
  train_batch_size: 1
  test_batch_size: 1
  random_crop_height: 320
  random_crop_width: 448
  img_format: 'jpg'
  event_suffix: 'event_corrected'
  condition:
  - name: 'N-E-N'
    min_guidance_scale: 2.0
    max_guidance_scale: 2.0

network:
- name: 'vae_event'
  pretrained_path: 'parameter/vae_event.pth'
  trainable: False
  scaling_factor: 0.18215
- name: 'vae_rgb'
  pretrained_path: ''
  trainable: False
  scaling_factor: 0.18215
- name: 'vae_rgb_fp16'
  pretrained_path: ''
  trainable: False
  scaling_factor: 0.18215

train:
  pipeline: 
    name: 'default'
  criterion:
    - name: 'l2_loss'
      lambda: 1.0